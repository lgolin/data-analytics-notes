# ── FORMAT (global — applies to all pages) ───────────────────────────────────
format:
  html:
    theme:
      light: cosmo
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: true
    code-tools: true
    code-overflow: wrap
    highlight-style: github
    css: styles.css

# ── EXECUTION (global) ────────────────────────────────────────────────────────
execute:
  warning: false
  message: false

editor: visual